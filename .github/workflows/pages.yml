name: Test and deploy to GitHub Pages

# Every push to main is tested, then the database is updated, then the site is published.
# Pull requests (and any other branch) are tested only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a production run halfway (it may be updating the database); superseded PR runs can go.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
      NEXT_PUBLIC_CREATE_PLAN_LINK: ${{ vars.CREATE_PLAN_LINK }}
      NEXT_PUBLIC_HOST_PLAN_LINK: ${{ vars.HOST_PLAN_LINK }}
      NEXT_PUBLIC_PASS_LINK: ${{ vars.PASS_LINK }}
      NEXT_PUBLIC_STRIPE_PORTAL_LINK: ${{ vars.STRIPE_PORTAL_LINK }}
      NEXT_PUBLIC_JOB_POST_LINK: ${{ vars.JOB_POST_LINK }}
      NEXT_PUBLIC_AD_WEEK_LINK: ${{ vars.AD_WEEK_LINK }}
      NEXT_PUBLIC_AD_MONTH_LINK: ${{ vars.AD_MONTH_LINK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Journeys run against the on-device build, so they pass whether or not the backend is connected.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # The deployed build connects to the PLACES backend when its public settings are present.
      # Only public values belong here: the Supabase URL, the anon key and the media provider's name.
      # With a custom domain (repository variable CUSTOM_DOMAIN, e.g. placesforus.com) the site is served from the
      # domain's root instead of /<repository>/.
      - name: Build for deploy
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            export PAGES_BASE_PATH="" NEXT_PUBLIC_SITE_URL="https://$CUSTOM_DOMAIN"
          fi
          npm run build
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "$CUSTOM_DOMAIN" > out/CNAME; fi
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          # Public values (safe to commit). Repository variables override them.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://zeveszwhbsguwnvuzfwd.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_7LMrPUqFLySJdJRZ_0kKYA_Kk_0r5Fc' }}
          NEXT_PUBLIC_MEDIA_PROVIDER: ${{ vars.MEDIA_PROVIDER }}
          NEXT_PUBLIC_ICE_SERVERS: ${{ vars.ICE_SERVERS }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: out

  # The database changes in supabase/migrations, tested on a fresh copy before they touch the real one:
  # they must apply from scratch, apply AGAIN on top (so re-running can never break), and keep every
  # security rule working. Gates the production database update.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0 # pinned: "latest" asks the GitHub API, which rate-limits shared runners
      - run: npm ci
      - run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Export local stack settings
        run: supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=' | sed 's/"//g' >> "$GITHUB_ENV"
      - name: Migrations are safe to re-run
        run: for f in supabase/migrations/*.sql; do echo "re-applying $f"; psql "$DB_URL" -q -v ON_ERROR_STOP=1 -f "$f"; done
      - run: npm run test:supabase
        env:
          SUPABASE_TEST_URL: ${{ env.API_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_TEST_SERVICE_KEY: ${{ env.SERVICE_ROLE_KEY }}

  # The whole shared world in a browser against a real Supabase stack: two people across every Place,
  # Virtual Places admin, security checks. Reported, but doesn't hold up a release.
  cloud-journeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0 # pinned: "latest" asks the GitHub API, which rate-limits shared runners
      - run: npm ci
      - run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Export local stack settings
        run: supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' | sed 's/"//g' >> "$GITHUB_ENV"
      - run: npm run build
        env:
          PAGES_BASE_PATH: /myplace
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.cloud.config.ts
        env:
          SUPABASE_TEST_URL: ${{ env.API_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_TEST_SERVICE_KEY: ${{ env.SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cloud-playwright-traces
          path: test-results

  # Applies new files in supabase/migrations to the live Supabase project, before the site that needs them.
  # Needs two repository secrets: SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD (skipped with a notice if missing).
  migrate:
    if: github.event_name != 'pull_request'
    needs: [build, database]
    runs-on: ubuntu-latest
    concurrency:
      group: production-database
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'zeveszwhbsguwnvuzfwd' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0 # pinned: "latest" asks the GitHub API, which rate-limits shared runners
      - name: Update the live database
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice title=Database not updated::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets to apply supabase/migrations automatically."
            exit 0
          fi
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --yes
      # Guests drop into rooms open to guests with just a name (anonymous sign-ins). Changes only this one auth setting.
      - name: Allow guests in open rooms
        continue-on-error: true
        run: |
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && exit 0
          status=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"external_anonymous_users_enabled": true}')
          if [ "$status" != "200" ]; then
            echo "::warning title=Guests not switched on::Supabase answered $status. Turn on Authentication → Sign In / Providers → Allow anonymous sign-ins."
            exit 1
          fi
          echo "Anonymous sign-ins: $(jq -r '.external_anonymous_users_enabled' /tmp/auth.json)"

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, migrate]
    runs-on: ubuntu-latest
    concurrency:
      group: production-site
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
