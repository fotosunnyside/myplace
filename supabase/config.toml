# Local development stack for PLACES (`npx supabase start`). Production settings live in the Supabase dashboard.
project_id = "places"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:4173/myplace/"]
enable_signup = true
# Guests drop into rooms that are open to guests with just a name (no account). On the live project, turn this on in
# Authentication → Sign In / Providers → "Allow anonymous sign-ins".
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.virtual-space-token]
verify_jwt = true

# Link previews for posts (public page metadata only), called with the publishable key.
[functions.link-preview]
verify_jwt = false
